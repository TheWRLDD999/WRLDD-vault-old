<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10091b"><meta name="description" content="The Juice WRLD Collection">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>WRLDD Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#09070f;--panel:#171020;--panel2:#21152d;--purple:#9b5de5;--purple2:#6f35a4;--muted:#bcaecb;--line:#382747;--white:#faf6ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -12%,#43245d 0,#1a1025 34%,var(--bg) 76%);color:var(--white);font:14px/1.55 Manrope,'Trebuchet MS',system-ui,sans-serif;letter-spacing:.05px}
button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:center;gap:12px;padding:13px 16px;background:#100a19eF;border-bottom:1px solid #ffffff17;backdrop-filter:blur(18px)}.brand-pic{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #b77aff;box-shadow:0 0 18px #9b5de566}.brand-wrap{min-width:0}.brand{font-size:20px;font-weight:800;letter-spacing:2.2px;line-height:1.2}.tag{font-size:9px;letter-spacing:2px;color:#d4b2f4;margin-top:4px;font-weight:700}
main{max-width:820px;margin:auto;padding:18px 14px 112px}.page{display:none;animation:rise .24s ease}.page.active{display:block}@keyframes rise{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:none}}
.hero{position:relative;overflow:hidden;padding:25px 20px;border:1px solid #b77aff55;border-radius:24px;background:linear-gradient(125deg,#38204d 0%,#1c1129 53%,#100b18 100%);box-shadow:0 18px 45px #0007}.hero:after{content:'999';position:absolute;right:-9px;bottom:-31px;font-size:115px;line-height:1;font-weight:800;color:#ffffff09;letter-spacing:-8px;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:2.5px;color:#d8b7f6;font-weight:800}.hero h1{font-size:27px;line-height:1.2;margin:10px 0 9px;max-width:520px}.hero p{margin:0;color:#d4c6df;max-width:490px}.hero .motto{margin-top:16px;color:#e2c5ff;font-weight:800;letter-spacing:3px;font-size:12px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:25px 2px 12px}.section-title{font-size:19px;font-weight:800;letter-spacing:.2px;margin:0}.section-kicker{font-size:10px;color:#aa96bc;letter-spacing:1.5px;text-transform:uppercase}.muted{color:var(--muted);line-height:1.65}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.quick-card{position:relative;min-height:104px;padding:15px;border:1px solid #ffffff18;border-radius:17px;background:linear-gradient(145deg,#21152e,#130e1b);text-align:left;color:var(--white);overflow:hidden}.quick-card:after{content:'↗';position:absolute;right:13px;top:11px;color:#c18bfa;font-size:17px}.quick-icon{display:block;font-size:20px;margin-bottom:7px}.quick-card strong{display:block;font-size:13px}.quick-card small{color:#b9a9c8;font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.stat{padding:12px 9px;text-align:center;border:1px solid #ffffff14;border-radius:14px;background:#120d1b}.stat strong{display:block;font-size:18px;color:#e4c7ff}.stat span{font-size:9px;letter-spacing:1px;color:#ad9cbb;text-transform:uppercase}
.card,.panel{background:linear-gradient(145deg,#1c1327,#130e1b);border:1px solid #ffffff18;border-radius:17px;padding:14px;min-width:0;box-shadow:0 8px 24px #0003}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#2b1b38}.cover-placeholder{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#60377c,#1a1025 72%);color:#ead8ff;font-size:34px;font-weight:900;letter-spacing:4px}.card h3{font-size:14px;margin:10px 0 3px}.card p{font-size:12px;color:var(--muted);margin:0}.action,.download-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(120deg,#8143b7,#5c2d83);color:white;border:1px solid #c18bfa35;border-radius:11px;padding:10px 13px;font-weight:800;font-size:12px;text-decoration:none;margin-top:10px}.action.secondary,.remove-btn{background:#2b2036;color:#d8c7e7;border-color:#ffffff14}.back{margin:0 0 14px}.track{padding:11px 3px;border-bottom:1px solid #ffffff12;color:#e8dff0;font-size:13px}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#0e0a14;color:white;margin:7px 0 12px}
.upload-box{padding:15px;border:1px dashed #8d5ab2;border-radius:16px;background:#1b1226;margin:12px 0 16px}.upload-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.upload-row strong{font-size:13px}.upload-row p{font-size:11px;margin:3px 0 0;color:var(--muted)}.file-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.file-label{display:inline-flex;align-items:center;gap:7px;padding:10px 13px;background:#6e3896;color:#fff;border-radius:11px;font-size:12px;font-weight:800;cursor:pointer}.media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.media-card{min-width:0;padding:8px;border:1px solid #ffffff19;border-radius:15px;background:linear-gradient(145deg,#21152d,#120d19);overflow:hidden}.media-card img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;object-position:center;border-radius:10px;background:#0c0811}.media-name{font-size:11px;color:#d7c9e2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:8px 2px 2px}.media-actions{display:flex;gap:6px}.media-actions a,.media-actions button{flex:1;min-width:0;text-align:center;border:0;border-radius:9px;padding:9px 5px;font-size:11px;font-weight:800;text-decoration:none;color:white;background:#713a9d}.media-actions button{background:#30243b;color:#d8c8e5}
.wall-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wall-card{background:#171020;border:1px solid #ffffff18;border-radius:15px;padding:8px;min-width:0}.wall-card img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;background:#160d20}.wall-actions{display:flex;gap:6px;flex-wrap:wrap}.wall-actions a,.wall-actions button{flex:1;text-align:center;font-size:11px;padding:9px 6px;border:0;border-radius:9px;background:#6d35a0;color:#fff;text-decoration:none;font-weight:800}.wall-actions button{background:#302039}
.tip{padding:11px 13px;border-left:3px solid #a56be0;border-radius:0 11px 11px 0;background:#21152d;color:#e0c9f4;font-size:12px;margin:10px 0 14px}.owner-note{font-size:11px;color:#c5b4d2}.hidden{display:none!important}footer{text-align:center;color:#8e7b9e;font-size:10px;letter-spacing:1px;padding:28px 0 12px}
nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;overflow-x:auto;gap:5px;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));background:#100b18f2;border-top:1px solid var(--line);backdrop-filter:blur(16px);scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{flex:0 0 auto;border:1px solid transparent;border-radius:12px;background:transparent;color:#bfaecc;padding:10px 12px;font-size:11px;font-weight:800}nav button.active{background:#472365;color:white;border-color:#9c66c5}
@media(min-width:620px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.media-grid,.wall-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.quick-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.hero{padding:32px 27px}.hero h1{font-size:32px}}
@media(max-width:360px){.brand{font-size:18px}.brand-pic{width:42px;height:42px}.media-grid,.wall-grid{gap:8px}.media-card,.wall-card{padding:6px}}
</style></head>
